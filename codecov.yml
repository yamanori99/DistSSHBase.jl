coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# GitHub emails every subscriber when Codecov posts a *new* PR comment.
comment: false

# Pkg.test (flag pkgtest) uploads on main push only.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: pkgtest
      carryforward: true
