# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Used from the PR head branch. https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US
tone_instructions: >
  Brief. Inline comments only for bugs or regressions in this diff.
  DistSSHBase is how a DistSSHKit family package names a host, reaches it over SSH, and prints help.
  Users add DistSSHKit.
  Stay inside the PR's stated scope.
reviews:
  profile: quiet
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  sequence_diagrams: true
  changed_files_summary: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  path_instructions:
    - path: "**/*.jl"
      instructions: >
        This package owns placement tokens, SSH, paths, help chrome, and the julia -m entry.
        Stay inside the PR's stated scope. Do not invent kit commands (go, drive, setup) here.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 1
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
